<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order - Sweet Crumbs Bakery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="body-style">
  <header class="header-style">
    <h1 class="header-title">Sweet Crumbs Bakery</h1>
    <nav class="nav-style">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="menu.html">Menu</a>
      <a class="nav-link" href="order.html">Order</a>
    </nav>
  </header>

  <section class="order-form-section">
    <h2 class="order-title">Place Your Order!</h2>
    <form class="form-style">
      <label class="form-label">Name:</label>
      <input class="form-input" type="text" name="name" required><br>

      <label class="form-label">Phone Number:</label>
      <input class="form-input" type="text" name="phone" required><br>

      <label class="form-label">Email (optional):</label>
      <input class="form-input" type="email" name="email"><br>

      <label class="form-label">Item Ordered:</label>
      <select class="form-input" name="item">
        <option>Strawberry Cake - RM 12</option>
        <option>Almond Cookies - RM 6</option>
      </select><br>

      <label class="form-label">Delivery / Pickup:</label>
      <input class="form-input" type="text" name="delivery"><br>

      <label class="form-label">Address (if delivery):</label>
      <input class="form-input" type="text" name="address"><br>

      <label class="form-label">Date Needed:</label>
      <input class="form-input" type="date" name="date"><br>

      <button class="btn" type="submit">Confirm Order</button>
    </form>
    <p class="order-note">After submitting, we will contact you to confirm your order. Thank you!</p>
  </section>

  <footer class="footer-style">
    <p class="footer-text">&copy; 2026 Sweet Crumbs Bakery. All Rights Reserved.</p>
  </footer>
</body>
</html>
